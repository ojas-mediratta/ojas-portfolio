name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PRODUCTION: "false"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test Goodreads sync
        run: npm run test:reading

      - name: Refresh Goodreads shelves
        # If Goodreads is unavailable, fail before replacing the last successful deployment.
        run: npm run sync:reading

      - name: Build
        run: npm run build

      - name: Add CNAME to artifact
        run: echo "ojasmediratta.com" > dist/CNAME

      - name: Create SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Inspect artifact
        run: ls -la dist && echo "----- CNAME -----" && cat dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
